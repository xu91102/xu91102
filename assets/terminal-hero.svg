<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coreGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(747 168) rotate(20) scale(420 260)">
      <stop offset="0" stop-color="#58A6FF" stop-opacity=".48"/>
      <stop offset=".45" stop-color="#7C3AED" stop-opacity=".24"/>
      <stop offset="1" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B12"/>
      <stop offset=".48" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#062033"/>
    </linearGradient>
    <linearGradient id="cubeTop" x1="623" y1="64" x2="838" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7EE787"/>
      <stop offset=".48" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#A371F7"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="598" y1="142" x2="760" y2="308" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F6FEB"/>
      <stop offset="1" stop-color="#6E40C9"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="782" y1="143" x2="924" y2="304" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2F81F7"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="ring" x1="430" y1="84" x2="1015" y2="272" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7EE787"/>
      <stop offset=".36" stop-color="#58A6FF"/>
      <stop offset=".68" stop-color="#A371F7"/>
      <stop offset="1" stop-color="#F778BA"/>
    </linearGradient>
    <filter id="blurGlow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.35 0 0 0 0 0.65 0 0 0 0 1 0 0 0 .55 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <filter id="thinGlow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feBlend in="SourceGraphic" in2="blur" mode="screen"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .stage { animation: stageFloat 6.2s ease-in-out infinite; transform-origin: 760px 178px; }
      .cube { animation: cubeFloat 4.8s ease-in-out infinite; transform-origin: 760px 176px; }
      .ringA { animation: orbitA 9s linear infinite; transform-origin: 760px 178px; }
      .ringB { animation: orbitB 12s linear infinite; transform-origin: 760px 178px; }
      .node { animation: nodePulse 2.6s ease-in-out infinite; }
      .node:nth-child(2n) { animation-delay: .35s; }
      .node:nth-child(3n) { animation-delay: .7s; }
      .bar { animation: barLift 3.2s ease-in-out infinite; transform-origin: bottom center; }
      .bar:nth-child(2n) { animation-delay: .22s; }
      .bar:nth-child(3n) { animation-delay: .47s; }
      .bar:nth-child(5n) { animation-delay: .76s; }
      .dash { stroke-dasharray: 16 18; animation: dashMove 12s linear infinite; }
      .stream { animation: streamMove 4.6s linear infinite; }
      .stream.two { animation-delay: 1.4s; }
      .stream.three { animation-delay: 2.6s; }
      .cursor { animation: cursorBlink 1.05s steps(2, start) infinite; }
      @keyframes stageFloat {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      @keyframes cubeFloat {
        0%,100% { transform: translateY(0) rotate(-1.5deg); }
        50% { transform: translateY(-16px) rotate(2deg); }
      }
      @keyframes orbitA {
        to { transform: rotate(360deg); }
      }
      @keyframes orbitB {
        to { transform: rotate(-360deg); }
      }
      @keyframes nodePulse {
        0%,100% { opacity: .35; transform: scale(.82); }
        50% { opacity: 1; transform: scale(1.18); }
      }
      @keyframes barLift {
        0%,100% { transform: scaleY(.5); opacity: .5; }
        50% { transform: scaleY(1); opacity: 1; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -360; }
      }
      @keyframes streamMove {
        0% { transform: translateX(-120px); opacity: 0; }
        18%,72% { opacity: .85; }
        100% { transform: translateX(430px); opacity: 0; }
      }
      @keyframes cursorBlink {
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="28" fill="url(#coreGlow)"/>
  <path d="M76 286C222 245 365 259 488 300C646 353 814 335 944 284C1080 231 1177 234 1280 265V360H0V309C25 301 50 293 76 286Z" fill="#050A13" opacity=".86"/>

  <g opacity=".22" stroke="#30363D">
    <path d="M52 73H1228"/>
    <path d="M52 127H1228"/>
    <path d="M52 181H1228"/>
    <path d="M52 235H1228"/>
    <path d="M52 289H1228"/>
    <path d="M161 32V328"/>
    <path d="M323 32V328"/>
    <path d="M485 32V328"/>
    <path d="M647 32V328"/>
    <path d="M809 32V328"/>
    <path d="M971 32V328"/>
    <path d="M1133 32V328"/>
  </g>

  <g transform="translate(78 70)">
    <text class="mono" x="0" y="0" fill="#8B949E" font-size="18">$ launch-profile --mode hologram</text>
    <text class="mono" x="0" y="47" fill="#F0F6FC" font-size="44" font-weight="800">hhang / xu91102</text>
    <text class="mono" x="0" y="86" fill="#58A6FF" font-size="22">AI coding workflows · harness engineering</text>
    <g transform="translate(0 126)">
      <rect width="378" height="76" rx="14" fill="#0D1117" stroke="#30363D"/>
      <path class="stream" d="M22 25H170" stroke="#7EE787" stroke-width="4" stroke-linecap="round"/>
      <path class="stream two" d="M52 48H252" stroke="#58A6FF" stroke-width="4" stroke-linecap="round"/>
      <path class="stream three" d="M118 62H314" stroke="#A371F7" stroke-width="4" stroke-linecap="round"/>
      <text class="mono" x="22" y="48" fill="#F0F6FC" font-size="18">build → verify → iterate</text>
    </g>
    <rect class="cursor" x="0" y="232" width="14" height="24" fill="#7EE787"/>
  </g>

  <g class="stage" filter="url(#thinGlow)">
    <ellipse cx="760" cy="214" rx="310" ry="92" stroke="url(#ring)" stroke-width="3" opacity=".72"/>
    <ellipse class="ringA" cx="760" cy="178" rx="244" ry="58" stroke="url(#ring)" stroke-width="2" opacity=".78" transform="rotate(-18 760 178)"/>
    <ellipse class="ringB" cx="760" cy="178" rx="205" ry="46" stroke="#7EE787" stroke-width="1.5" opacity=".42" transform="rotate(20 760 178)"/>
    <path class="dash" d="M500 224C607 132 717 104 836 137C936 165 1009 215 1071 280" stroke="#58A6FF" stroke-width="2.5" opacity=".62"/>

    <g class="cube" filter="url(#blurGlow)">
      <path d="M760 62L897 139L760 216L623 139L760 62Z" fill="url(#cubeTop)" opacity=".93"/>
      <path d="M623 139L760 216V320L623 242V139Z" fill="url(#cubeLeft)" opacity=".84"/>
      <path d="M897 139L760 216V320L897 242V139Z" fill="url(#cubeRight)" opacity=".82"/>
      <path d="M760 62V216M623 139L760 216L897 139M760 216V320" stroke="#F0F6FC" stroke-opacity=".56" stroke-width="2.4"/>
      <path d="M675 139L760 92L845 139L760 187L675 139Z" fill="#0D1117" opacity=".36"/>
    </g>

    <g transform="translate(575 235) skewY(-18) scale(1 .72)">
      <rect class="bar" x="0" y="-38" width="18" height="82" rx="4" fill="#0E4429"/>
      <rect class="bar" x="31" y="-72" width="18" height="116" rx="4" fill="#26A641"/>
      <rect class="bar" x="62" y="-104" width="18" height="148" rx="4" fill="#39D353"/>
      <rect class="bar" x="93" y="-64" width="18" height="108" rx="4" fill="#58A6FF"/>
      <rect class="bar" x="124" y="-128" width="18" height="172" rx="4" fill="#7C3AED"/>
      <rect class="bar" x="155" y="-86" width="18" height="130" rx="4" fill="#2F81F7"/>
      <rect class="bar" x="186" y="-152" width="18" height="196" rx="4" fill="#A371F7"/>
      <rect class="bar" x="217" y="-96" width="18" height="140" rx="4" fill="#14B8A6"/>
      <rect class="bar" x="248" y="-122" width="18" height="166" rx="4" fill="#39D353"/>
      <rect class="bar" x="279" y="-70" width="18" height="114" rx="4" fill="#58A6FF"/>
      <rect class="bar" x="310" y="-102" width="18" height="146" rx="4" fill="#7EE787"/>
      <rect class="bar" x="341" y="-52" width="18" height="96" rx="4" fill="#1F6FEB"/>
    </g>

    <g fill="#F0F6FC">
      <circle class="node" cx="548" cy="141" r="5"/>
      <circle class="node" cx="653" cy="91" r="4"/>
      <circle class="node" cx="875" cy="91" r="4"/>
      <circle class="node" cx="1003" cy="168" r="5"/>
      <circle class="node" cx="942" cy="260" r="4"/>
      <circle class="node" cx="596" cy="255" r="4"/>
    </g>
  </g>

  <g transform="translate(1060 74)" opacity=".9">
    <rect width="128" height="150" rx="16" fill="#0D1117" stroke="#30363D"/>
    <text class="mono" x="21" y="36" fill="#8B949E" font-size="13">STATUS</text>
    <text class="mono" x="21" y="69" fill="#7EE787" font-size="22" font-weight="800">ONLINE</text>
    <path d="M22 100H106" stroke="#30363D"/>
    <text class="mono" x="21" y="126" fill="#58A6FF" font-size="14">WFM NODE</text>
  </g>
</svg>
