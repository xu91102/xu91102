<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.46" stop-color="#111827"/>
      <stop offset="1" stop-color="#062C43"/>
    </linearGradient>
    <linearGradient id="panel" x1="175" y1="54" x2="1105" y2="306" gradientUnits="userSpaceOnUse">
      <stop stop-color="#161B22"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="cubeA" x1="658" y1="80" x2="896" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="cubeB" x1="788" y1="74" x2="928" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.34 0 0 0 0 0.65 0 0 0 0 1 0 0 0 0.42 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .float { animation: float 5s ease-in-out infinite; transform-origin: 820px 168px; }
      .scan { animation: scan 4.2s linear infinite; }
      .blink { animation: blink 1.1s steps(2, start) infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .grid rect { animation: lift 3.8s ease-in-out infinite; }
      .grid rect:nth-child(2n) { animation-delay: .25s; }
      .grid rect:nth-child(3n) { animation-delay: .55s; }
      .grid rect:nth-child(5n) { animation-delay: .85s; }
      @keyframes float {
        0%, 100% { transform: translateY(0) rotate(-1deg); }
        50% { transform: translateY(-14px) rotate(1.5deg); }
      }
      @keyframes scan {
        0% { transform: translateX(-180px); opacity: 0; }
        20%, 70% { opacity: .75; }
        100% { transform: translateX(880px); opacity: 0; }
      }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse {
        0%, 100% { opacity: .45; }
        50% { opacity: 1; }
      }
      @keyframes lift {
        0%, 100% { transform: translateY(0); opacity: .45; }
        50% { transform: translateY(-10px); opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
